# Docker compose for local dev
# Run: docker compose -f deployment/docker-compose.yml up --build

services:
  api:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - CESAR_MODEL_PATH=/artifacts/model_latest.joblib
      - CESAR_CONTRACT_PATH=/artifacts/contract_latest.json
    volumes:
      - ../artifact_storage:/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  ui:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.ui
    ports:
      - "8501:8501"
    environment:
      - CESAR_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
